
---
- name: Bootstrap of my Arch machine
  hosts: local
  become: true

  collections:
    - community.general

  vars:
    # system packages from official repos
    pacman_packages:
      - base-devel
      - git
      - kitty
      - networkmanager
      - bluez
      - cups
      - pipewire
      - pipewire-pulse
      - pipewire-alsa
      - wireplumber
      - xorg-server
      - xorg-apps
      - xorg-xinit
      - xorg-twm
      - xorg-xclock
      - xterm
      - ttf-jetbrains-mono-nerd
      - polkit
      - polkit-gnome
      - alsa-utils
      - pavucontrol
      - arandr
      - brightnessctl
      - nodejs
      - blueman
      - nitrogen
      - fzf
      - tldr
      - wget
      - network-manager-applet
      - flameshot
      - lxappearance
      - zathura

    # systemd units to enable+start
    systemd_units:
      - NetworkManager
      - bluetooth
      - cups
      - fstrim.timer

  pre_tasks:
    - name: Pacman – make sure database is up to date
      community.general.pacman:
        update_cache: true

  tasks:
    - name: Install system packages
      community.general.pacman:
        name: "{{ pacman_packages }}"
        state: present

    - name: Clone arc-icon-theme repo
      ansible.builtin.git:
        repo: https://github.com/horst3180/arc-icon-theme.git
        dest: /tmp/arc-icon-theme
        depth: 1
        update: false

    - name: Build arc-icon-theme
      ansible.builtin.command: ./autogen.sh --prefix=/usr
      args:
        chdir: /tmp/arc-icon-theme

    - name: Make install arc-icon-theme
      ansible.builtin.command: make install
      args:
        chdir: /tmp/arc-icon-theme

    - name: Clean arc-icon-theme
      ansible.builtin.file:
        path: /tmp/arc-icon-theme
        state: absent

    - name: Enable & start services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: "{{ systemd_units }}"
      register: svc_result

  post_tasks:
    - name: Show service changes (debug)
      ansible.builtin.debug:
        var: svc_result.results | map(attribute='name') | list
      when: svc_result is defined

